name: Release

# 推送 v* 標籤（例如 v1.0.8）就會自動用 ClickOnce 打包並發佈到 GitHub Releases，
# 已安裝的程式下次開啟時就會偵測到新版本並詢問是否更新（更新檔一樣從 Release 下載）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ClickOnce 的 setup.exe 與 manifest 需要 .NET Framework 版的 MSBuild（Visual Studio 內建）
      - uses: microsoft/setup-msbuild@v2

      - name: Publish (ClickOnce)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          msbuild password/password.csproj /restore /t:Publish `
            /p:PublishProfile=ClickOnceProfile `
            /p:RuntimeIdentifier=win-x64 /p:SelfContained=true `
            /p:Version=$version /p:ApplicationVersion="$version.0" `
            /p:PublishDir="$PWD\clickonce\" /p:PublishUrl="$PWD\clickonce\" `
            /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip installer
        shell: pwsh
        run: |
          # 只打包 ClickOnce 安裝需要的檔案：setup.exe、PasswordKeeper.application、Application Files
          $items = @('clickonce\setup.exe', 'clickonce\PasswordKeeper.application', 'clickonce\Application Files')
          foreach ($i in $items) { if (-not (Test-Path $i)) { throw "missing $i" } }
          Compress-Archive -Path $items -DestinationPath PasswordKeeper-ClickOnce.zip
          Get-Item PasswordKeeper-ClickOnce.zip | Select-Object Name, Length

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = "下載 PasswordKeeper-ClickOnce.zip，解壓縮後執行 setup.exe 安裝。`n`nDownload PasswordKeeper-ClickOnce.zip, extract it, and run setup.exe."
          gh release create "${{ github.ref_name }}" PasswordKeeper-ClickOnce.zip --title "${{ github.ref_name }}" --notes $notes
